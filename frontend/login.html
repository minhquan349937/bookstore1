<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - BookStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
    <div id="alertContainer"></div>

    <div class="form-container">
        <h2>🔐 Đăng Nhập</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username" class="form-label">Tên đăng nhập</label>
                <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Mật khẩu</label>
                <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="loginBtn">Đăng Nhập</button>
        </form>

        <div class="form-text">
            Chưa có tài khoản? <a href="/register.html">Đăng ký ngay</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script>
        // Nếu đã đăng nhập thì chuyển hướng
        window.addEventListener('DOMContentLoaded', () => {
            if (AuthManager.isLoggedIn()) {
                window.location.href = '/index.html';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Đang đăng nhập...';

            try {
                const response = await API.login(username, password);

                // Lưu token và thông tin user
                AuthManager.setToken(response.token);
                AuthManager.setCustomerId(response.id);
                AuthManager.setCurrentUser({
                    username: response.username,
                    email: response.email
                });

                showAlert('Đăng nhập thành công!', 'success');
                setTimeout(() => window.location.href = '/index.html', 1500);

            } catch (error) {
                showAlert(error.message || 'Đăng nhập thất bại. Vui lòng kiểm tra lại!', 'error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Đăng Nhập';
            }
        });
    </script>
</body>
</html>
