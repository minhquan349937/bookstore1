<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điện Thoại - MegaStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🛍️ MegaStore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/index.html">📚 Sách</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/laptops.html">💻 Laptop</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/mobiles.html">📱 Điện Thoại</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/cart.html">🛒 Giỏ Hàng<span id="cartCount" class="badge bg-primary ms-2">0</span></a>
                    </li>
                    <li class="nav-item">
                        <div id="navbarRight"></div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="alertContainer"></div>

    <div class="container-fluid py-5">
        <!-- SEARCH BAR -->
        <div class="search-container">
            <div class="search-bar">
                <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm điện thoại...">
                <select id="sortSelect" class="form-select" style="max-width: 150px;">
                    <option value="newest">Mới nhất</option>
                    <option value="price_asc">Giá: Thấp -> Cao</option>
                    <option value="price_desc">Giá: Cao -> Thấp</option>
                </select>
                <button class="btn btn-primary" onclick="searchMobiles()">🔍 Tìm Kiếm</button>
            </div>
        </div>

        <!-- MOBILES GRID -->
        <div id="mobilesContainer" class="row g-4">
            <div class="col-12 loading-container">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- PAGINATION -->
        <div id="paginationContainer" class="pagination"></div>
    </div>

    <footer class="bg-light text-center py-4 mt-5 border-top">
        <p class="text-muted">© 2026 MegaStore - Cửa hàng trực tuyến đa ngành hàng</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script>
        let currentPage = 1;
        let isSearching = false;
        let searchQuery = '';
        let sortBy = 'newest';

        // Load mobile khi page load
        window.addEventListener('DOMContentLoaded', () => {
            loadMobiles();
            updateCartCount();
        });

        // Hàm load danh sách mobile
        async function loadMobiles() {
            try {
                const container = document.getElementById('mobilesContainer');
                container.innerHTML = '<div class="col-12 loading-container"><div class="spinner"></div></div>';

                const response = await fetch(`${MOBILE_API}/mobiles/`);
                if (!response.ok) throw new Error('Failed to load mobiles');

                let mobiles = await response.json();

                // Search filter
                if (searchQuery) {
                    mobiles = mobiles.filter(m =>
                        m.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        m.brand.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        m.model_name.toLowerCase().includes(searchQuery.toLowerCase())
                    );
                }

                // Sort
                mobiles = sortMobiles(mobiles, sortBy);

                renderMobiles(mobiles);
            } catch (error) {
                showAlert('Lỗi: ' + error.message, 'danger');
                document.getElementById('mobilesContainer').innerHTML = '';
            }
        }

        // Hàm sort
        function sortMobiles(mobiles, sortType) {
            const sorted = [...mobiles];
            switch (sortType) {
                case 'price_asc':
                    return sorted.sort((a, b) => a.price - b.price);
                case 'price_desc':
                    return sorted.sort((a, b) => b.price - a.price);
                case 'newest':
                default:
                    return sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            }
        }

        // Hàm render
        function renderMobiles(mobiles) {
            const container = document.getElementById('mobilesContainer');
            if (mobiles.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted">Không tìm thấy điện thoại</div>';
                return;
            }

            container.innerHTML = mobiles.map(mobile => `
                <div class="col-md-6 col-lg-4 col-xl-3">
                    <div class="card h-100 product-card">
                        <div class="card-img-top" style="aspect-ratio: 16/9; overflow: hidden; background: #f0f0f0;">
                            <img src="${mobile.image || 'https://via.placeholder.com/300x200?text=Mobile'}" alt="${mobile.name}" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${mobile.brand} ${mobile.name}</h5>
                            <p class="card-text small text-muted">
                                <strong>Model:</strong> ${mobile.model_name}<br>
                                <strong>OS:</strong> ${mobile.os}<br>
                                <strong>RAM:</strong> ${mobile.ram} | <strong>Storage:</strong> ${mobile.storage}
                            </p>
                            <div class="mt-auto">
                                <div class="price-section mb-3">
                                    <span class="h5">${new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(mobile.price)}</span>
                                    <small class="text-success ms-2">Còn hàng: ${mobile.stock}</small>
                                </div>
                                <div class="d-grid gap-2">
                                    <button class="btn btn-sm btn-outline-primary mb-2" onclick="viewMobileDetail(${mobile.id})">👁️ Chi tiết</button>
                                    <button class="btn btn-sm btn-primary" onclick="addToCart({id: ${mobile.id}, name: '${mobile.brand} ${mobile.name}', price: ${mobile.price}, type: 'mobile'})">➕ Thêm vào giỏ</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Hàm tìm kiếm
        function searchMobiles() {
            searchQuery = document.getElementById('searchInput').value;
            currentPage = 1;
            loadMobiles();
        }

        // Hàm xem chi tiết
        function viewMobileDetail(mobileId) {
            window.location.href = `/detail.html?product_id=${mobileId}&type=mobile`;
        }

        // Event listeners
        document.getElementById('sortSelect').addEventListener('change', (e) => {
            sortBy = e.target.value;
            loadMobiles();
        });

        // Key press search
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchMobiles();
            }
        });
    </script>
</body>
</html>
