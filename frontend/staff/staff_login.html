<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Nhân Viên - BookStore Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .staff-login-container {
            max-width: 500px;
            margin: 100px auto;
            background: white;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .staff-login-container h2 {
            text-align: center;
            margin-bottom: 40px;
            color: #dc3545;
            font-weight: 700;
        }

        .staff-login-container .form-icon {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="alertContainer"></div>

    <div class="staff-login-container">
        <div class="form-icon">👨‍💼</div>
        <h2>Đăng Nhập Quản Lý</h2>
        <form id="staffLoginForm">
            <div class="form-group">
                <label for="username" class="form-label">Tên đăng nhập</label>
                <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Mật khẩu</label>
                <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required>
            </div>

            <button type="submit" class="btn btn-danger w-100" id="loginBtn">Đăng Nhập</button>
        </form>

        <div class="form-text" style="margin-top: 20px;">
            📍 <small>Chỉ dành cho nhân viên quản lý</small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/staff-common.js"></script>
    <script>
        // Nếu đã đăng nhập thì chuyển hướng
        window.addEventListener('DOMContentLoaded', () => {
            if (StaffAuthManager.isLoggedIn()) {
                window.location.href = '/staff/dashboard.html';
            }
        });

        document.getElementById('staffLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Đang đăng nhập...';

            try {
                const response = await StaffAPI.staffLogin(username, password);

                // Lưu token và thông tin nhân viên
                StaffAuthManager.setToken(response.token);
                StaffAuthManager.setStaffId(response.id);
                StaffAuthManager.setCurrentStaff({
                    username: response.username,
                    email: response.email,
                    role: response.role
                });

                showAlert(`Đăng nhập thành công! Xin chào ${response.username}`, 'success');
                setTimeout(() => window.location.href = '/staff/dashboard.html', 1500);

            } catch (error) {
                showAlert(error.message || 'Đăng nhập thất bại. Vui lòng kiểm tra lại!', 'error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Đăng Nhập';
            }
        });
    </script>
</body>
</html>
